\n.newpanel { display: none; align-items: center; gap: 20px; margin-top: 8px; }\n.newpanel.show { display: flex; }\n.newpanel select { border: 0; border-bottom: 1px solid #d0d0d0; border-radius: 0; background: transparent; font: inherit; font-size: 14px; padding: 6px 2px; color: var(--text); -webkit-appearance: none; appearance: none; }\n.newpanel .make { background: transparent; padding: 6px 0; font-size: 14px; margin-left: auto; }\n.newpanel .make:active { background: transparent; opacity: .4; }\n.dh { margin: 56px 0 6px; font-size: 12px; color: var(--sub); }\n.months { list-style: none; margin: 0; padding: 0; }\n.months li { display: flex; align-items: center; justify-content: space-between; max-width: 230px; }\n.months .go { text-align: left; background: transparent; padding: 14px 0; font-size: 14px; color: #666666; }\n.months .go:active { background: transparent; opacity: .4; }\n.months li.cur .go { color: var(--text); font-weight: 400; }\n.months .del { width: 36px; height: 44px; background: transparent; color: var(--sub); font-size: 14px; }\n.months .del:active { background: transparent; opacity: .4; }\n.bottom { margin-top: auto; padding-top: 48px; }\n.syncnote { font-size: 12px; color: var(--sub); margin-bottom: 10px; }\n.foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.foot .wide { grid-column: 1 / -1; }\n.foot button { background: var(--bg); height: 40px; border-radius: 4px; font-size: 13px; }\n.foot button:active { background: var(--btn-press); }\n\n/* 확인 시트 */\n.sheetback { z-index: 40; }\nbody.sheet-open .sheetback, body.edit-open .sheetback { opacity: 1; visibility: visible; }\n\n/* 금액 수정 팝업 (키보드에 가리지 않게 위쪽에 띄움) */\n.editpop { position: fixed; left: 50%; top: 14vh; width: min(86vw, 340px); background: var(--bg); border-radius: 4px; box-shadow: 0 0 40px rgba(0,0,0,.14); overflow: hidden; z-index: 50; opacity: 0; visibility: hidden; transform: translate(-50%, -8px); transition: opacity .2s, transform .2s, visibility 0s linear .2s; }\n one; transition: opacity .2s, transform .2s; z-index: 60; width: max-content; max-width: calc(100vw - 48px); text-align: center; font-weight: 400; }\n.toast.show { opacity: 1; transform: translate(-50%, 0); }\n\n@media (prefers-reduced-motion: reduce) {\n  * { transition: none !important; }\n}\n.sheet{left:50%!important;right:auto!important;bottom:auto!important;top:50%!important;width:min(86vw,340px)!important;max-width:none!important;margin:0!important;padding:0!important;transform:translate(-50%,-46%)!important;opacity:0;transition:transform .2s,opacity .2s,visibility .2s!important}\nbody.sheet-open .sheet{transform:translate(-50%,-50%)!important;opacity:1}\n<\/style>\n<\/head>\n<body>\n\n<main class=\"app\">\n  <div class=\"top\">\n    <button class=\"round\" id=\"menuBtn\" aria-label=\"메뉴 열기\">+<\/button>\n  <\/div>\n\n  <section class=\"total\">\n    <span>이번달 누적 금액<\/span>\n    <strong id=\"total\">0원<\/strong>\n  <\/section>\n  <div class=\"subtotals\">\n    <div><span>카드<\/span><b id=\"sumCard\">0<\/b><\/div>\n    <div><span>현금<\/span><b id=\"sumCash\">0<\/b><\/div>\n    <div><span>기타<\/span><b id=\"sumEtc\">0<\/b><\/div>\n  <\/div>\n\n  <div class=\"label lead\">\n    <span>내용<\/span>\n    <div class=\"datepill\" id=\"datePill\"><span id=\"dateText\"><\/span><input type=\"date\" id=\"dateInput\" aria-label=\"날짜 선택\"><\/div>\n  <\/div>\n  <input class=\"field\" id=\"memo\" type=\"text\" maxlength=\"40\" autocomplete=\"off\" enterkeyhint=\"done\" aria-label=\"내용\">\n\n  <div class=\"label\"><span>금액<\/span><\/div>\n  <div class=\"amountrow\">\n    <div class=\"paypick\" id=\"paypick\">\n      <button type=\"button\" data-pay=\"card\">카드<\/button>\n      <button type=\"button\" data-pay=\"cash\">현금<\/button>\n      <button type=\"button\" data-pay=\"etc\">기타<\/button>\n    <\/div>\n    <div class=\"amountval empty\" id=\"amount\" role=\"status\" aria-label=\"금액\">0<\/div>\n    <button class=\"mini\" id=\"backBtn\" type=\"button\" aria-label=\"지우기\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z\"/><path d=\"M12.5 10l4 4M16.5 10l-4 4\"/><\/svg>\n    <\/button>\n    <button class=\"okbtn\" id=\"okBtn\" type=\"button\">확인<\/button>\n  <\/div>\n\n  <div class=\"pad\" id=\"pad\">\n    <button data-k=\"7\">7<\/button><button data-k=\"8\">8<\/button><button data-k=\"9\">9<\/button><button data-k=\"+\" class=\"op\" aria-label=\"더하기\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 2.5v11M2.5 8h11\"/><\/svg><\/button>\n    <button data-k=\"4\">4<\/button><button data-k=\"5\">5<\/button><button data-k=\"6\">6<\/button><button data-k=\"-\" class=\"op\" aria-label=\"빼기\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M2.5 8h11\"/><\/svg><\/button>\n    <button data-k=\"1\">1<\/button><button data-k=\"2\">2<\/button><button data-k=\"3\">3<\/button><button data-k=\"*\" class=\"op\" aria-label=\"곱하기\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3.5 3.5l9 9M12.5 3.5l-9 9\"/><\/svg><\/button>\n    <button data-k=\"C\" class=\"op\" aria-label=\"모두 지우기\">C<\/button><button data-k=\"0\">0<\/button><button data-k=\".\">.<\/button><button data-k=\"=\" class=\"op eq\" aria-label=\"계산\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M2.5 5.5h11M2.5 10.5h11\"/><\/svg><\/button>\n  <\/div>\n\n  <div class=\"label sortrow\"><span>내용<\/span><button class=\"sortbtn\" id=\"sortBtn\" type=\"button\"><\/button><\/div>\n  <ul class=\"list\" id=\"list\"><\/ul>\n<\/main>\n\n<\!-- 왼쪽 탭 -->\n<div class=\"back drawer-back\" id=\"drawerBack\"><\/div>\n<aside class=\"drawer\" id=\"drawer\" aria-label=\"월별 내역\">\n  <div class=\"dtop\"><button class=\"textbtn\" id=\"closeBtn\" type=\"button\">닫기<\/button><\/div>\n  <button class=\"row\" id=\"newBtn\" type=\"button\">새로 만들기<\/button>\n  <div class=\"newpanel\" id=\"newPanel\">\n    <select id=\"ySel\" aria-label=\"년도\"><\/select>\n    <select id=\"mSel\" aria-label=\"월\"><\/select>\n    <button class=\"make\" id=\"makeBtn\" type=\"button\">만들기<\/button>\n  <\/div>\n  <div class=\"dh\">내역<\/div>\n  <ul class=\"months\" id=\"months\"><\/ul>\n  <div class=\"bottom\">\n    <div class=\"syncnote\" id=\"syncNote\"><\/div>\n    <div class=\"foot\">\n      <button id=\"exportBtn\" type=\"button\">시트로 백업<\/button>\n      <button id=\"importBtn\" type=\"button\">시트에서 불러오기<\/button>\n      <button id=\"linkBtn\" class=\"wide\" type=\"button\">시트 연결하기<\/button>\n    <\/div>\n  <\/div>\n<\/aside>\n\n<\!-- 확인 시트 -->\n<div class=\"back sheetback\" id=\"sheetBack\"><\/div>\n<div class=\"editpop\" id=\"editPop\" role=\"dialog\" aria-modal=\"true\" aria-label=\"금액 수정\">\n  <p>금액 수정<\/p>\n  <input id=\"editInput\" type=\"text\" inputmode=\"numeric\" autocomplete=\"off\" aria-label=\"금액\">\n  <div class=\"editbtns\">\n    <button id=\"editNo\" type=\"button\">취소<\/button>\n    <button id=\"editSave\" type=\"button\">저장<\/button>\n  <\/div>\n<\/div>\n<div class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\">\n  <div class=\"box\">\n    <p id=\"sheetMsg\"><\/p>\n    <button id=\"sheetYes\" type=\"button\"><\/button>\n  <\/div>\n  <button class=\"cancel\" id=\"sheetNo\" type=\"button\">취소<\/button>\n<\/div>\n\n<div class=\"toast\" id=\"toast\" role=\"status\"><\/div>\n\n<script>\n(function () {\n  'use strict';\n\n  var KEY = 'ledger.v1';\n  function $(id) { return document.getElementById(id); }\n  function p2(n) { return String(n).padStart(2, '0'); }\n  function won(n) { return n.toLocaleString('ko-KR') + '원'; }\n  function ymOf(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1); }\n  function todayStr() { var d = new Date(); return ymOf(d) + '-' + p2(d.getDate()); }\n  function ymLabel(k) { var a = k.split('-'); return a[0] + '년 ' + Number(a[1]) + '월'; }\n\n  /* ---------- 저장 / 불러오기 ---------- */\n  function normalize(s) {\n    if (!s || typeof s !== 'object' || !s.months || typeof s.months !== 'object') return null;\n    var out = { current: '', months: {} };\n    for (var k in s.months) {\n      if (!/^\\d{4}-\\d{2}$/.test(k) || !Array.isArray(s.months[k])) return null;\n      var arr = [];\n      for (var i = 0; i < s.months[k].length; i++) {\n        var it = s.months[k][i];\n        if (!it || typeof it.date !== 'string' || typeof it.amount !== 'number' || !isFinite(it.amount)) return null;\n        arr.push({ id: typeof it.id === 'number' ? it.id : Date.now() + i, date: it.date, memo: String(it.memo || ''), amount: it.amount, pay: (it.pay === 'card' || it.pay === 'cash') ? it.pay : 'etc' });\n      }\n      out.months[k] = arr;\n    }\n    var keys = Object.keys(out.months).sort();\n    out.current = (typeof s.current === 'string' && out.months[s.current]) ? s.current : (keys.length ? keys[keys.length - 1] : '');\n    if (!out.current) {\n      out.current = ymOf(new Date());\n      out.months[out.current] = [];\n    }\n    return out;\n  }\n\n  function load() {\n    try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return null; }\n  }\n  function save() {\n    try { localStorage.setItem(KEY, JSON.stringify(state)); }\n    catch (e) { toast('저장하지 못했어요'); }\n  }\n\n  var state = load();\n  if (!state) {\n    var ym = ymOf(new Date());\n    state = { current: ym, months: {} };\n    state.months[ym] = [];\n    save();\n  }\n\n  /* ---------- 토스트 ---------- */\n  var toastTimer;\n  function toast(msg) {\n    var t = $('toast');\n    t.textContent = msg;\n    t.classList.add('show');\n    clearTimeout(toastTimer);\n    toastTimer = setTimeout(function () { t.classList.remove('show'); }, msg.length > 16 ? 3800 : 1800);\n  }\n\n  /* ---------- 확인 시트 ---------- */\n  var sheetAction = null;\n  function ask(msg, label, fn) {\n    $('sheetMsg').textContent = msg;\n    $('sheetYes').textContent = label;\n    sheetAction = fn;\n    document.body.classList.add('sheet-open');\n  }\n  function closeSheet() {\n    document.body.classList.remove('sheet-open');\n    sheetAction = null;\n  }\n  $('sheetYes').addEventListener('click', function () {\n    var f = sheetAction;\n    closeSheet();\n    if (f) f();\n  });\n  $('sheetNo').addEventListener('click', closeSheet);\n  $('sheetBack').addEventListener('click', closeSheet);\n  $('sheetBack').addEventListener('click', function () { closeEdit(); });\n\n  /* ---------- 금액 수정 팝업 (숫자 키보드) ---------- */\n  var editItem = null;\n  function fmtDigits(str) {\n    var neg = /^\\s*-/.test(str);\n    var d = str.replace(/[^\\d]/g, '').replace(/^0+(?=\\d)/, '');\n    if (!d) return neg ? '-' : '';\n    return (neg ? '-' : '') + d.replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n  }\n  function openEdit(it) {\n    editItem = it;\n    var inp = $('editInput');\n    inp.value = fmtDigits(String(it.amount));\n    document.body.classList.add('edit-open');\n    inp.focus();\n    try { inp.setSelectionRange(0, inp.value.length); } catch (e) {}\n  }\n  function closeEdit() {\n    document.body.classList.remove('edit-open');\n    editItem = null;\n    $('editInput').blur();\n  }\n  $('editInput').addEventListener('input', function () { this.value = fmtDigits(this.value); });\n  $('editInput').addEventListener('keydown', function (e) {\n    if (e.key === 'Enter') { e.preventDefault(); $('editSave').click(); }\n  });\n  $('editNo').addEventListener('click', closeEdit);\n  $('editSave').addEventListener('click', function () {\n    if (!editItem) return;\n    var raw = $('editInput').value;\n    var n = parseInt(raw.replace(/[^\\d]/g, ''), 10);\n    if (!n) { toast('금액을 입력해 주세요'); return; }\n    if (n > 1e12) { toast('금액이 너무 커요'); return; }\n    editItem.amount = /^-/.test(raw) ? -n : n;\n    save();\n    mark(state.current, 'save');\n    closeEdit();\n    renderMain();\n  });\n\n  /* ---------- 날짜 ---------- */\n  var selDate = '';\n  function defaultDate() {\n    var t = todayStr();\n    return t.slice(0, 7) === state.current ? t : state.current + '-01';\n  }\n  function updateDateUI() {\n    var parts = state.current.split('-');\n    var last = new Date(Number(parts[0]), Number(parts[1]), 0).getDate();\n    var inp = $('dateInput');\n    inp.min = state.current + '-01';\n    inp.max = state.current + '-' + p2(last);\n    inp.value = selDate;\n    $('dateText').textContent = selDate.slice(5).replace('-', '/');\n  }\n  $('dateInput').addEventListener('change', function (e) {\n    if (!e.target.value) return;\n    selDate = e.target.value;\n    updateDateUI();\n  });\n\n  /* ---------- 계산기 ---------- */\n  var expr = '';\n  var fresh = false;\n  var OPS = '+-*';\n\n  function evalExpr(e) {\n    var t = e.match(/\\d+\\.?\\d*|\\.\\d+|[+\\-*]/g);\n    if (!t) return null;\n    while (t.length && OPS.indexOf(t[t.length - 1]) !== -1) t.pop();\n    if (!t.length) return null;\n    var i = 0, sign = 1;\n    if (t[0] === '-') { sign = -1; i = 1; }\n    if (i >= t.length) return null;\n    var nums = [sign * parseFloat(t[i])], ops = [];\n    i++;\n    while (i < t.length) {\n      ops.push(t[i]);\n      nums.push(parseFloat(t[i + 1]));\n      i += 2;\n    }\n    var n2 = [nums[0]], o2 = [];\n    for (var j = 0; j < ops.length; j++) {\n      if (ops[j] === '*') { n2[n2.length - 1] *= nums[j + 1]; }\n      else { o2.push(ops[j]); n2.push(nums[j + 1]); }\n    }\n    var r = n2[0];\n    for (var k = 0; k < o2.length; k++) { r = o2[k] === '+' ? r + n2[k + 1] : r - n2[k + 1]; }\n    return isFinite(r) ? r : null;\n  }\n\n  function fmtExpr(e) {\n    return e\n      .replace(/\\d+(\\.\\d*)?/g, function (m) {\n        var p = m.split('.');\n        var ip = p[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',');\n        return p.length > 1 ? ip + '.' + p[1] : ip;\n      })\n      .replace(/\\*/g, ' × ')\n      .replace(/(.)-/g, '$1 − ')\n      .replace(/\\+/g, ' + ')\n      .replace(/^-/, '−');\n  }\n\n  function renderAmount() {\n    var el = $('amount');\n    if (!expr) { el.textContent = '0'; el.classList.add('empty'); }\n    else { el.textContent = fmtExpr(expr); el.classList.remove('empty'); el.scrollLeft = el.scrollWidth; }\n  }\n\n  function press(k) {\n    if (k === 'C') { expr = ''; fresh = false; }\n    else if (k === '=') {\n      var v = evalExpr(expr);\n      if (v !== null) {\n        if (Math.abs(v) > 1e12) { toast('금액이 너무 커요'); return; }\n        expr = String(Math.round(v));\n        fresh = true;\n      }\n    }\n    else if (OPS.indexOf(k) !== -1) {\n      fresh = false;\n      if (!expr) return;\n      if (OPS.indexOf(expr.slice(-1)) !== -1) expr = expr.slice(0, -1) + k;\n      else expr += k;\n    }\n    else if (k === '.') {\n      if (fresh) { expr = ''; fresh = false; }\n      var lastD = expr.split(/[+\\-*]/).pop();\n      if (lastD.indexOf('.') !== -1) return;\n      expr += lastD === '' ? '0.' : '.';\n    }\n    else {\n      if (fresh) { expr = ''; fresh = false; }\n      var last = expr.split(/[+\\-*]/).pop();\n      if (last === '0') {\n        if (k === '0') return;\n        expr = expr.slice(0, -1) + k;\n      } else {\n        if (last.replace('.', '').length >= 12) return;\n        expr += k;\n      }\n    }\n    renderAmount();\n  }\n\n  $('pad').addEventListener('click', function (e) {\n    var b = e.target.closest('button[data-k]');\n    if (b) press(b.getAttribute('data-k'));\n  });\n  $('backBtn').addEventListener('click', function () {\n    expr = expr.slice(0, -1);\n    fresh = false;\n    renderAmount();\n  });\n\n  /* ---------- 날짜 정렬 ---------- */\n  var UP_SVG = '<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3.5 10.5L8 6l4.5 4.5\"/><\/svg>';\n  var DOWN_SVG = '<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3.5 5.5L8 10l4.5-4.5\"/><\/svg>';\n  var sortDir = 'asc';\n  try { if (localStorage.getItem('ledger.sort') === 'desc') sortDir = 'desc'; } catch (e) {}\n  function renderSort() {\n    var b = $('sortBtn');\n    b.innerHTML = sortDir === 'asc' ? UP_SVG : DOWN_SVG;\n    b.setAttribute('aria-label', sortDir === 'asc' ? '날짜 오름차순. 누르면 내림차순' : '날짜 내림차순. 누르면 오름차순');\n  }\n  $('sortBtn').addEventListener('click', function () {\n    sortDir = sortDir === 'asc' ? 'desc' : 'asc';\n    try { localStorage.setItem('ledger.sort', sortDir); } catch (e) {}\n    renderSort();\n    renderMain();\n  });\n\n  /* ---------- 결제 종류 ---------- */\n  var PAYS = { card: '카드', cash: '현금', etc: '기타' };\n  var curPay = 'card';\n  try { var lp = localStorage.getItem('ledger.pay'); if (lp && PAYS[lp]) curPay = lp; } catch (e) {}\n  function renderPay() {\n    var bs = document.querySelectorAll('#paypick button');\n    for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-pay') === curPay);\n  }\n  $('paypick').addEventListener('click', function (e) {\n    var b = e.target.closest('button[data-pay]');\n    if (!b) return;\n    curPay = b.getAttribute('data-pay');\n    try { localStorage.setItem('ledger.pay', curPay); } catch (err) {}\n    renderPay();\n  });\n\n  /* ---------- 내역 추가 ---------- */\n  $('okBtn').addEventListener('click', function () {\n    var v = evalExpr(expr);\n    if (v === null || Math.round(v) === 0) { toast('금액을 입력해 주세요'); return; }\n    if (Math.abs(v) > 1e12) { toast('금액이 너무 커요'); return; }\n    var list = state.months[state.current];\n    var id = Date.now();\n    list.forEach(function (it) { if (it.id >= id) id = it.id + 1; });\n    list.push({ id: id, date: selDate, memo: $('memo').value.trim(), amount: Math.round(v), pay: curPay });\n    save();\n    mark(state.current, 'save');\n    $('memo').value = '';\n    $('memo').blur();\n    expr = '';\n    fresh = false;\n    renderAmount();\n    renderMain();\n  });\n  $('memo').addEventListener('keydown', function (e) {\n    if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }\n  });\n\n  /* ---------- 메인 화면 ---------- */\n  function renderMain() {\n    var items = state.months[state.current].slice().sort(function (a, b) {\n      return a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id;\n    });\n    if (s eDrawer();\n  });\n\n  /* ---------- 구글 시트 연동 ---------- */\n  var SURL = 'ledger.sheetUrl';\n  var PEND = 'ledger.pending';\n  var OKF = 'ledger.sheetOk';\n  function getUrl() { try { return localStorage.getItem(SURL) || ''; } catch (e) { return ''; } }\n  function getPend() { try { return JSON.parse(localStorage.getItem(PEND)) || {}; } catch (e) { return {}; } }\n  function setPend(o) { try { localStorage.setItem(PEND, JSON.stringify(o)); } catch (e) {} }\n  function getOk() { try { return localStorage.getItem(OKF) || ''; } catch (e) { return ''; } }\n  function setOk(v) { try { localStorage.setItem(OKF, v); } catch (e) {} }\n\n  function updateNote() {\n    var note = $('syncNote'), btn = $('linkBtn');\n    if (!getUrl()) {\n      note.textContent = '시트가 연결되지 않았어요. 연결하면 자동으로 저장돼요.';\n      btn.textContent = '시트 연결하기';\n    } else if (getOk() === '0') {\n      note.textContent = '시트 연결에 문제가 있어요. 주소와 코드를 확인해 주세요.';\n      btn.textContent = '시트 연결 변경';\n    } else if (getOk() !== '1') {\n      note.textContent = '시트 연결을 확인하는 중이에요';\n      btn.textContent = '시트 연결 변경';\n    } else {\n      note.textContent = Object.keys(getPend()).length ? '시트에 저장 대기 중이에요' : '시트에 자동 저장 중이에요';\n      btn.textContent = '시트 연결 변경';\n    }\n  }\n\n  // 시트 연결 확인: 시트가 정상 응답하면 true\n  function check() {\n    var url = getUrl();\n    if (!url) return Promise.resolve(false);\n    return fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + 'action=all')\n      .then(function (r) { return r.json(); })\n      .then(function (j) { return !!(j && j.ok); })\n      .catch(function () { return false; });\n  }\n\n  // 시트로 보내기. 같은 내용을 여러 번 보내도 결과가 같아서 안전해요.\n  // 결과: ok(확인됨) / unknown(보냈지만 확인 불가) / bad(시트가 오류로 응답) / fail(인터넷 문제)\n  function post(body) {\n    var url = getUrl();\n    if (!url) return Promise.resolve('fail');\n    var headers = { 'Content-Type': 'text/plain;charset=utf-8' };\n    var text = JSON.stringify(body);\n    return fetch(url, { method: 'POST', headers: headers, body: text })\n      .then(function (r) { return r.text(); })\n      .then(function (t) {\n        var j = null;\n        try { j = JSON.parse(t); } catch (e) {}\n        return (j && j.ok) ? 'ok' : 'bad';\n      })\n      .catch(function () {\n        return fetch(url, { method: 'POST', mode: 'no-cors', headers: headers, body: text })\n          .then(function () { return 'unknown'; }, function () { return 'fail'; });\n      });\n  }\n\n  var syncTimer = null, flushing = false;\n  function mark(key, kind) {\n    var p = getPend();\n    p[key] = kind + ':' + Date.now() + Math.random();\n    setPend(p);\n    updateNote();\n    clearTimeout(syncTimer);\n    syncTimer = setTimeout(flush, 800);\n  }\n  function flush() {\n    if (!getUrl() || flushing) return;\n    var p = getPend();\n    var keys = Object.keys(p);\n    if (!keys.length) return;\n    flushing = true;\n    Promise.all(keys.map(function (k) {\n      var kind = p[k].split(':')[0];\n      var body = null;\n      if (kind === 'delete') body = { action: 'delete', key: k };\n      else if (state.months[k]) body = { action: 'month', key: k, items: state.months[k] };\n      if (!body) return Promise.resolve({ k: k, st: 'ok' });\n      return post(body).then(function (st) { return { k: k, st: st }; });\n    })).then(function (results) {\n      var cur = getPend();\n      results.forEach(function (r) {\n        var done = r.st === 'ok' || (r.st === 'unknown' && getOk() === '1');\n        if (r.st === 'ok') setOk('1');\n        if (r.st === 'bad') setOk('0');\n        if (done && cur[r.k] === p[r.k]) delete cur[r.k];\n      });\n      setPend(cur);\n      flushing = false;\n      updateNote();\n    });\n  }\n  window.addEventListener('online', function () { startCheck(); });\n  document.addEventListener('visibilitychange', function () { if (!document.hidden) startCheck(); });\n\n  // 연결을 확인하고, 정상이면 밀린 저장을 보내요\n  function startCheck() {\n    if (!getUrl() || !navigator.onLine) return;\n    check().then(function (ok) {\n      setOk(ok ? '1' : '0');\n      updateNote();\n      if (ok) flush();\n    });\n  }\n\n  function reportBackup(st) {\n    if (st === 'ok') { setOk('1'); setPend({}); toast('시트에 저장했어요'); }\n    else if (st === 'unknown') {\n      if (getOk() === '1') { setPend({}); toast('시트로 보냈어요. 시트에서 확인해 주세요'); }\n      else toast('시트 연결을 확인하지 못했어요. 코드와 배포를 다시 확인해 주세요');\n    }\n    else if (st === 'bad') { setOk('0'); toast('시트 코드에 문제가 있어요. 설정을 다시 확인해 주세요'); }\n    else toast('저장하지 못했어요. 인터넷을 확인해 주세요');\n    updateNote();\n  }\n\n  $('linkBtn').addEventListener('click', function () {\n    var u = window.prompt('시트의 웹 앱 주소를 붙여넣으세요\\n(https://script.google.com/…/exec)', getUrl());\n    if (u === null) return;\n    u = u.trim();\n    if (!u) {\n      try { localStorage.removeItem(SURL); localStorage.removeItem(OKF); } catch (e) {}\n      updateNote();\n      toast('시트 연결을 해제했어요');\n      return;\n    }\n    if (!/^https:\\/\\/script\\.google\\.com\\/.+\\/exec/.test(u)) { toast('주소가 올바르지 않아요'); return; }\n    try { localStorage.setItem(SURL, u); localStorage.removeItem(OKF); } catch (e) {}\n    updateNote();\n    toast('시트 연결을 확인하는 중…');\n    check().then(function (ok) {\n      setOk(ok ? '1' : '0');\n      updateNote();\n      if (!ok) { toast('시트 연결을 확인하지 못했어요. 시트에 코드를 붙여넣고 새 버전으로 배포했는지 확인해 주세요'); return; }\n      toast('연결됐어요. 시트 내용은 그대로 두었어요');\n      var emptyLocal = Object.keys(state.months).every(function (k) { return !(state.months[k] || []).length; });\n      if (!emptyLocal) return;\n      fetch(u + (u.indexOf('?') > -1 ? '&' : '?') + 'action=all')\n        .then(function (r) { return r.json(); })\n        .then(function (j) {\n          if (!j || !j.ok || !j.months || !Object.keys(j.months).length) return;\n          var parsed = normalize({ current: state.current, months: j.months });\n          if (!parsed) return;\n          ask('시트에 저장된 내역이 있어요. 지금 불러올까요?', '불러오기', function () {\n            state = parsed; save(); setPend({});\n            setMonth(state.current); renderMonths(); updateNote();\n            toast('불러왔어요');\n          });\n        }).catch(function () {});\n    });\n  });\n\n  $('exportBtn').addEventListener('click', function () {\n    if (!getUrl()) { toast('먼저 시트를 연결해 주세요'); return; }\n    toast('시트로 보내는 중…');\n    post({ action: 'all', months: state.months }).then(reportBackup);\n  });\n\n  $('importBtn').addEventListener('click', function () {\n    var url = getUrl();\n    if (!url) { toast('먼저 시트를 연결해 주세요'); return; }\n    toast('시트에서 불러오는 중…');\n    fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + 'action=all')\n      .then(function (r) { return r.json(); })\n      .then(function (j) {\n        if (!j || !j.ok || !j.months) throw new Error('bad');\n        setOk('1');\n        updateNote();\n        if (!Object.keys(j.months).length) { toast('시트에 불러올 내역이 없어요'); return; }\n        var parsed = normalize({ current: state.current, months: j.months });\n        if (!parsed) throw new Error('bad');\n        ask('현재 내역을 시트 내용으로 바꿀까요? 시트에 없는 내역은 사라져요.', '바꾸기', function () {\n          state = parsed;\n          save();\n          setPend({});\n          setMonth(state.current);\n          renderMonths();\n          updateNote();\n          toast('불러왔어요');\n        });\n      })\n      .catch(function () { toast('불러오지 못했어요. 시트 주소와 배포를 확인해 주세요'); });\n  });\n\n  /* ---------- 시작 ---------- */\n  fillSelects();\n  selDate = defaultDate();\n  updateDateUI();\n  renderAmount();\n  renderSort();\n  renderPay();\n  renderMain();\n  updateNote();\n  startCheck();\n})();\n<\/script>\n<\/body>\n<\/html>\n","<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"투두\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<meta name=\"theme-color\" content=\"#ffffff\">\n<title>투두<\/title>\n<style>\n:root{\n  --bg:#ffffff;\n  --ink:#222222;\n  --ink2:#6f6f6f;\n  --ink3:#a8a8a8;\n  --line:#ececec;\n  --soft:#f3f3f3;\n  --band:#eeeeee;\n  --dark:#2a2a2a;\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);\n  font-family:-apple-system,BlinkMacSystemFont,\"Apple SD Gothic Neo\",\"Pretendard\",\"Noto Sans KR\",\"Malgun Gothic\",sans-serif;\n  font-weight:400;-webkit-text-size-adjust:100%}\nbody{overflow-x:hidden}\nbutton{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}\nul{list-style:none;margin:0;padding:0}\n\n.app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;\n  padding:calc(env(safe-area-inset-top,0px) + 44px) 26px calc(env(safe-area-inset-bottom,0px) + 24px)}\n\n/* 상단 */\n.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}\n.ht{display:flex;align-items:baseline;gap:8px;min-width:0}\n.ht b{font-size:17px;font-weight:600;letter-spacing:-.2px}\n.ht span{font-size:15px;color:var(--ink2)}\n.nav{display:flex;align-items:center;gap:2px}\n.nav .txt{font-size:13px;color:var(--ink2);padding:6px 8px}\n.nav .ar{width:34px;height:34px;display:grid;place-items:center;color:var(--ink2)}\n\n/* 캘린더 */\n.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12.5px;color:var(--ink3);margin-bottom:8px}\n.wk{display:grid;grid-template-columns:repeat(7,1fr);margin:0 -10px;padding:0 10px;border-radius:999px}\n.wk.on{background:var(--band)}\n.d{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;color:var(--ink)}\n.d:disabled{cursor:default}\n.d .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}\n.d.is-today .n{font-weight:700}\n.d.sel .n{background:var(--dark);color:#fff;font-weight:600}\n.d .dot{width:3px;height:3px;border-radius:50%;margin-top:2px;background:transparent}\n.d.has .dot{background:var(--ink3)}\n\n/* 오늘 */\n.today{margin-top:26px}\n.th{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}\n.th h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.4px}\n.plus{width:38px;height:38px;display:grid;place-items:center;margin-right:-8px;color:var(--ink)}\n\n.row{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}\n.acts{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:8px}\n.delbtn,.movebtn,.editbtn{width:46px;height:44px;\n  border:1px solid #c4c4c4;border-radius:14px;background:#fff;display:grid;place-items:center;color:var(--ink2)}\n.card{position:relative;background:#fff;display:flex;gap:14px;align-items:flex-start;padding:16px 0;\n  transition:transform .22s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}\n.ico{flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--ink2)}\n.body{flex:1;min-width:0;cursor:pointer}\n.body small{display:block;font-size:11.5px;color:var(--ink3);margin-bottom:3px}\n.body p{margin:0;font-size:15px;font-weight:500;line-height:1.45;word-break:break-word;white-space:pre-wrap}\n.row.done .body p{color:var(--ink3);text-decoration:line-through;font-weight:400}\n.grip{flex:none;width:38px;height:30px;margin:-2px -8px 0 0;display:grid;place-items:center;color:var(--ink3);touch-action:none;cursor:grab}\n.row.drag{position:relative;z-index:5;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.12);border-radius:12px;transition:none}\n.row.drag .card{padding-left:8px;padding-right:8px}\n.empty{padding:34px 0;text-align:center;font-size:13.5px;color:var(--ink3);line-height:1.7}\n\n.foot{margin-top:auto;padding-top:46px;text-align:center}\n.foot button{font-size:12.5px;color:var(--ink3);padding:8px 12px}\n\n/* 팝업 */\n.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:10}\n.scrim.on{opacity:1;pointer-events:auto}\n.sheet{position:fixed;z-index:11;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);\n  width:calc(100% - 40px);max-width:390px;background:#fff;border-radius:24px;overflow:hidden;\n  box-shadow:0 10px 40px rgba(0,0,0,.14);\n  opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:opacity .2s ease,transform .22s ease}\n.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}\n.sh-head{background:#a9a9a9;color:#fff;text-align:center;font-size:15px;padding:17px 16px;font-weight:500}\n.sh-body{padding:22px 22px 22px}\n.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}\n.cat{height:38px;border-radius:12px;background:var(--soft);font-size:14px;color:var(--ink2)}\n.cat.on{background:var(--dark);color:#fff}\n.field{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px 14px;\n  font:inherit;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none}\n.field:focus{border-color:#bdbdbd}\ntextarea.field{height:150px;resize:none;font-size:14px;line-height:1.5;color:var(--ink2)}\n.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}\n.b{height:46px;border-radius:14px;font-size:15px}\n.b.ghost{background:var(--soft);color:var(--ink2)}\n.b.dark{background:var(--dark);color:#fff}\n.hint{font-size:12.5px;color:var(--ink3);line-height:1.65;margin:0 0 12px}\n.shake{animation:shake .25s}\n@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n\n.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translate(-50%,10px);\n  background:var(--dark);color:#fff;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;\n  transition:opacity .2s ease,transform .2s ease;z-index:20;white-space:nowrap}\n.toast.on{opacity:1;transform:translate(-50%,0)}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n.body p{font-size:12.5px!important;line-height:1.4!important}\n.body small{font-size:10.5px!important;margin-bottom:2px!important}\n.row .card{padding-top:9px!important;padding-bottom:9px!important}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n\n  <header class=\"head\">\n    <div class=\"ht\"><b id=\"hdDate\"><\/b><span id=\"hdDow\"><\/span><\/div>\n    <div class=\"nav\">\n      <button class=\"txt\" id=\"goToday\">오늘<\/button>\n      <button class=\"ar\" id=\"prev\" aria-label=\"이전 달\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n      <\/button>\n      <button class=\"ar\" id=\"next\" aria-label=\"다음 달\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg>\n      <\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"dow\"><span>일<\/span><span>월<\/span><span>화<\/span><span>수<\/span><span>목<\/span><span>금<\/span><span>토<\/span><\/div>\n  <div id=\"cal\"><\/div>\n\n  <section class=\"today\">\n    <div class=\"th\">\n      <h2 id=\"listTitle\">오늘<\/h2>\n      <button class=\"plus\" id=\"add\" aria-label=\"내용 추가\">\n        <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M12 4v16M4 12h16\"/><\/svg>\n      <\/button>\n    <\/div>\n    <ul id=\"list\"><\/ul>\n  <\/section>\n\n  <div class=\"foot\"><button id=\"openBk\">백업 · 불러오기<\/button><\/div>\n<\/div>\n\n<div class=\"scrim\" id=\"scrim\"><\/div>\n\n<\!-- 입력 팝업 -->\n<div class=\"sheet\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-label=\"내용 입력\">\n  <div class=\"sh-head\" id=\"shTitle\"><\/div>\n  <div class=\"sh-body\">\n    <div class=\"cats\" id=\"cats\">\n      <button class=\"cat on\" data-cat=\"todo\">할일<\/button>\n      <button class=\"cat\" data-cat=\"plan\">약속<\/button>\n      <button class=\"cat\" data-cat=\"meal\">식사<\/button>\n      <button class=\"cat\" data-cat=\"memo\">메모<\/button>\n    <\/div>\n    <input class=\"field\" id=\"txt\" type=\"text\" maxlength=\"200\" placeholder=\"내용을 입력하세요\" autocomplete=\"off\" enterkeyhint=\"done\">\n    <div class=\"btns\">\n      <button class=\"b ghost\" id=\"shClose\">닫기<\/button>\n      <button class=\"b dark\" id=\"shSave\">등록<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\!-- 백업 팝업 -->\n<div class=\"sheet\" id=\"bk\" role=\"dialog\" aria-modal=\"true\" aria-label=\"백업 및 불러오기\">\n  <div class=\"sh-head\">백업 · 불러오기<\/div>\n  <div class=\"sh-body\">\n    <p class=\"hint\" id=\"bkInfo\"><\/p>\n    <textarea class=\"field\" id=\"bkText\" spellcheck=\"false\"><\/textarea>\n    <div class=\"btns\">\n      <button class=\"b ghost\" id=\"bkCopy\">백업 복사<\/button>\n      <button class=\"b dark\" id=\"bkLoad\">불러오기<\/button>\n    <\/div>\n    <div class=\"btns\" style=\"grid-template-columns:1fr;margin-top:10px\">\n      <button class=\"b ghost\" id=\"bkClose\">닫기<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(function(){\n  'use strict';\n\n  /* ---------- 기본 값 ---------- */\n  var LS = 'todo-cal-v1';\n  var LB = 'todo-cal-last-backup';\n  var DOW = ['일','월','화','수','목','금','토'];\n  var CAT_NAME = {todo:'할일', plan:'약속', meal:'식사', memo:'메모'};\n  var SW = 164; // 밀었을 때 열리는 버튼(다음날 넘기기 + 삭제) 영역 너비\n\n  var ICON = {\n    todo:  '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><\/svg>',\n    todoDone:'<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"#2a2a2a\"/><path d=\"M8.2 12.4l2.6 2.6 5-5.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>',\n    plan:  '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"5.5\" width=\"16\" height=\"14.5\" rx=\"3\"/><path d=\"M4 10.5h16M8.5 3.5V7M15.5 3.5V7\"/><\/svg>',\n    meal:  '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2\"/><path d=\"M7 2v20\"/><path d=\"M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7\"/><\/svg>',\n    memo:  '<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z\"/><path d=\"M14 3v5h5M9 13h6M9 17h4\"/><\/svg>',\n    grip:  '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M5 8h14M5 12h14M5 16h14\"/><\/svg>',\n    next:  '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 14l5-5-5-5\"/><path d=\"M4 20v-7a4 4 0 0 1 4-4h12\"/><\/svg>',\n    edit: '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z\"/><path d=\"M14 7l3 3\"/><\/svg>',\ntrash: '<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M18.5 7l-.8 12a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9L5.5 7M9 7V4.5h6V7M10 11v6M14 11v6\"/><\/svg>'\n  };\n\n  /* ---------- 데이터 ---------- */\n  var data = { v:1, items:{} };\n\n  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }\n  function pad(n){ return n < 10 ? '0'+n : ''+n; }\n  function keyOf(y,m,d){ return y+'-'+pad(m+1)+'-'+pad(d); }\n  function esc(s){ return String(s).replace(/[&<>\"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]; }); }\n\n  function load(){\n    try{\n      var r = localStorage.getItem(LS);\n      if(r){ var d = clean(JSON.parse(r)); if(d) data = d; }\n    }catch(e){}\n  }\n  function save(){\n    try{ localStorage.setItem(LS, JSON.stringify(data)); }\n    catch(e){ toast('저장에 실패했어요'); }\n  }\n  // 불러온 데이터가 올바른 모양인지 확인하고 정리\n  function clean(d){\n    if(!d || typeof d !== 'object' || !d.items || typeof d.items !== 'object') return null;\n    var out = { v:1, items:{} };\n    Object.keys(d.items).forEach(function(k){\n      if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(k) || !Array.isArray(d.items[k])) return;\n      var arr = d.items[k].filter(function(it){ return it && typeof it.text === 'string' && it.text.trim(); })\n        .map(function(it){\n          return {\n            id: typeof it.id === 'string' ? it.id : uid(),\n            cat: CAT_NAME[it.cat] ? it.cat : 'memo',\n            text: it.text,\n            done: it.done === true\n          };\n        });\n      if(arr.length) out.items[k] = arr;\n    });\n    return out;\n  }\n\n  /* ---------- 상태 ---------- */\n  var now = new Date();\n  var todayKey = keyOf(now.getFullYear(), now.getMonth(), now.getDate());\n  var vy = now.getFullYear(), vm = now.getMonth();   // 보고 있는 달\n  var sel = todayKey;                                 // 선택한 날짜\n  var editingId = null;\n  var editCat = 'todo';\n\n  function parseKey(k){ var p = k.split('-'); return {y:+p[0], m:+p[1]-1, d:+p[2]}; }\n  function dayItems(k){ return data.items[k] || []; }\n\n  /* ---------- 화면 그리기 ---------- */\n  var $ = function(id){ return document.getElementById(id); };\n\n  function renderHead(){\n    var s = parseKey(sel);\n    var dow = new Date(s.y, s.m, s.d).getDay();\n    $('hdDate').textContent = s.y+'년 '+(s.m+1)+'월 '+s.d+'일';\n    $('hdDow').textContent = DOW[dow]+'요일';\n  }\n\n  function renderCal(){\n    var first = new Date(vy, vm, 1).getDay();\n    var dim = new Date(vy, vm+1, 0).getDate();\n    var cells = [], i;\n    for(i=0;i<first;i++) cells.push(0);\n    for(i=1;i<=dim;i++) cells.push(i);\n    while(cells.length % 7) cells.push(0);\n\n    var s = parseKey(sel);\n    var selDay = (s.y === vy && s.m === vm) ? s.d : -1;\n    var html = '';\n    for(var w=0; w<cells.length; w+=7){\n      var week = cells.slice(w, w+7);\n      var on = selDay > 0 && week.indexOf(selDay) !== -1;\n      html += '<div class=\"wk'+(on?' on':'')+'\">';\n      week.forEach(function(d){\n        if(!d){ html += '<button class=\"d\" disabled aria-hidden=\"true\"><\/button>'; return; }\n        var k = keyOf(vy, vm, d);\n        var cls = 'd';\n        if(k === todayKey) cls += ' is-today';\n        if(k === sel) cls += ' sel';\n        if(dayItems(k).length) cls += ' has';\n        html += '<button class=\"'+cls+'\" data-k=\"'+k+'\" aria-label=\"'+(vm+1)+'월 '+d+'일\"><span class=\"n\">'+d+'<\/span><span class=\"dot\"><\/span><\/button>';\n      });\n      html += '<\/div>';\n    }\n    $('cal').innerHTML = html;\n  }\n\n  function renderList(){\n    var s = parseKey(sel);\n    $('listTitle').textContent = sel === todayKey ? '오늘' : (s.m+1)+'월 '+s.d+'일';\n    var items = dayItems(sel);\n    if(!items.length){\n      $('list').innerHTML = '<li class=\"empty\">등록된 내용이 없어요<br>오른쪽 위 + 를 눌러 추가해 보세요<\/li>';\n      openCard = null;\n      return;\n    }\n    $('list').innerHTML = items.map(function(it){\n      var isTodo = it.cat === 'todo';\n      var ico = isTodo\n        ? '<button class=\"ico chk\" data-act=\"toggle\" aria-label=\"완료 표시\">'+(it.done?ICON.todoDone:ICON.todo)+'<\/button>'\n        : '<span class=\"ico\">'+ICON[it.cat]+'<\/span>';\n
